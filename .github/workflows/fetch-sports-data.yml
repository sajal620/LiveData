name: Fetch Sports Data

on:
  schedule:
    - cron: "*/10 * * * *"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch-sports-data:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Fetch and process sports data
        run: |
          python fetch_sports_data.py sports_data.json

      - name: Check generated data
        run: |
          python - <<'PY'
          import json

          with open(
              "sports_data.json",
              "r",
              encoding="utf-8"
          ) as f:
              data = json.load(f)

          print(
              "Total matches:",
              data.get("total_matches")
          )

          print(
              "Live matches:",
              data.get("live_match")
          )

          print(
              "Last update:",
              data.get("last_update_time")
          )
          PY

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add sports_data.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          git commit -m "Update sports data"

          git push
